services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
      POSTGRES_DB: dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://dashboard:${POSTGRES_PASSWORD:-dashboard}@postgres:5432/dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
      RUST_LOG: ${RUST_LOG:-info}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "17231:17231"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      GRAPHQL_URL: ${GRAPHQL_URL:-http://backend:17231/graphql}
    ports:
      - "17232:17232"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
